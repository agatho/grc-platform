<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="628" height="382" viewBox="132 25 628 382" role="img" class="arctos-bpmn" aria-labelledby="arctos-bpmn-title" aria-describedby="arctos-bpmn-desc"><defs><marker id="arctos-sequenceflow-end-d14-0" viewBox="0 0 20 20" refX="11" refY="10" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 5 L 11 10 L 1 15 z" fill="#12181f" stroke="#12181f" stroke-width="1" stroke-linejoin="round"/></marker><marker id="arctos-association-end-d14-1" viewBox="0 0 20 20" refX="11" refY="10" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 5 L 11 10 L 1 15" fill="none" stroke="#12181f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><title id="arctos-bpmn-title">synth-data-objects-and-artifacts</title><desc id="arctos-bpmn-desc">Der Prozess beginnt mit „Startereignis D_Start“. Schritt 1: „Startereignis D_Start“ führt zu „Antrag erfassen“. Schritt 2: „Antrag erfassen“ führt zu „Bonitaet bewerten“. Schritt 3: „Bonitaet bewerten“ führt zu „Endereignis D_End“. Schritt 4: „Endereignis D_End“ endet hier. Schritt 5: „Kundenstamm“ endet hier. Schritt 6: „Pruefung nach § 18 KWG — Vier-Augen-Prinzip“ endet hier. Schritt 7: „Antrag“ endet hier.</desc><rect x="132" y="25" width="628" height="382" fill="#ffffff" aria-hidden="true"/><g class="arctos-bpmn-layer"><g class="djs-element djs-shape" data-element-id="Group_1" role="img" aria-label="Gruppe ohne Namen (Group_1)" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:Group" aria-hidden="true"><rect x="220" y="130" width="300" height="130" rx="10" ry="10" class="bpmn-outline bpmn-group" fill="none" stroke="#5b6673" stroke-width="2" stroke-dasharray="10,6,0.5,6" pointer-events="none" data-border="dashed"/><text font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, &quot;Liberation Sans&quot;, sans-serif" font-size="12" fill="#12181f" text-anchor="middle" dominant-basel