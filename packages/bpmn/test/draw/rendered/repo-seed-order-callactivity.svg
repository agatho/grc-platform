<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="670" height="130" viewBox="105 60 670 130" role="img" class="arctos-bpmn" aria-labelledby="arctos-bpmn-title" aria-describedby="arctos-bpmn-desc"><defs><marker id="arctos-sequenceflow-end-d6-0" viewBox="0 0 20 20" refX="11" refY="10" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 5 L 11 10 L 1 15 z" fill="#12181f" stroke="#12181f" stroke-width="1" stroke-linejoin="round" stroke-dasharray="10000 1"/></marker></defs><title id="arctos-bpmn-title">repo-seed-order-callactivity</title><desc id="arctos-bpmn-desc">Der Prozess beginnt mit „Auftrag eingegangen“. Schritt 1: „Auftrag eingegangen“ führt zu „Auftrag annehmen und pruefen“. Schritt 2: „Auftrag annehmen und pruefen“ führt zu „Tourenplanung und Logistik“. Schritt 3: „Tourenplanung und Logistik“ führt zu „Bearbeitung und Auslieferung“. Schritt 4: „Bearbeitung und Auslieferung“ führt zu „Auftrag abgeschlossen“. Schritt 5: „Auftrag abgeschlossen“ endet hier.</desc><rect x="105" y="60" width="670" height="130" fill="#ffffff" aria-hidden="true"/><g class="arctos-bpmn-layer"><g class="djs-element djs-shape" data-element-id="Task_OA_Annahme" role="button" aria-label="Aufgabe „Auftrag annehmen und pruefen“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:Task" aria-hidden="true"><rect x="240" y="80" width="100" height="80" rx="10" ry="10" class="bpmn-outline bpmn-activity" fill="#ffffff" stroke="#12181f" stroke-width="2" data-border="thin"/><text font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, &quot;Liberation Sans&quot;, sans-serif" font-size="12" fill="#12181f" text-anchor="middle" dominant-baseline="alphabetic" class="djs-label" xml:space="preserve"><tspan x="290" y="102.1">Auftrag</tspan><tspan x="290" y="116.5">annehmen und</tspan><tspan x="290" y="130.9">pruefen</tspan></text></g></g><g class="djs-element djs-shape" data-element-id="CallActivity_OA_Touren" role="button" aria-label="Aufruf eines U