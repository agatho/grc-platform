xt-anchor="middle" dominant-baseline="alphabetic" class="djs-label" xml:space="preserve"><tspan x="510" y="125">Service Task</tspan></text></g></g><g class="djs-element djs-shape" data-element-id="T_Send" role="button" aria-label="Sendeaufgabe „Send Task“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:SendTask" aria-hidden="true"><rect x="600" y="80" width="100" height="80" rx="10" ry="10" class="bpmn-outline bpmn-activity" fill="#ffffff" stroke="#12181f" stroke-width="2" data-border="thin"/><g transform="translate(606 86) scale(0.8)" class="bpmn-task-symbol" data-symbol="SendTask"><path d="M 1 4 L 19 4 L 19 16 L 1 16 z" fill="#12181f" stroke="#12181f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1 4 L 10 11.5 L 19 4" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, &quot;Liberation Sans&quot;, sans-serif" font-size="12" fill="#12181f" text-anchor="middle" dominant-baseline="alphabetic" class="djs-label" xml:space="preserve"><tspan x="650" y="125">Send Task</tspan></text></g></g><g class="djs-element djs-shape" data-element-id="T_Receive" role="button" aria-label="Empfangsaufgabe „Receive Task“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:ReceiveTask" aria-hidden="true"><rect x="180" y="220" width="100" height="80" rx="10" ry="10" class="bpmn-outline bpmn-activity" fill="#ffffff" stroke="#12181f" stroke-width="2" data-border="thin"/><g transform="translate(186 226) scale(0.8)" class="bpmn-task-symbol" data-symbol="ReceiveTask"><path d="M 1 4 L 19 4 L 19 16 L 1 16 z" fill="#ffffff" stroke="#12181f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1 4 L 10 11.5 L 19 4" fill="none" stroke="#12181f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, &quot;Liberation Sans&quot;, sans-serif