<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="640" height="400" viewBox="80 60 640 400" role="img" class="arctos-bpmn" aria-labelledby="arctos-bpmn-title" aria-describedby="arctos-bpmn-desc"><title id="arctos-bpmn-title">synth-all-task-types</title><desc id="arctos-bpmn-desc">Der Prozess beginnt mit „Startereignis T_Start“. Schritt 1: „Startereignis T_Start“ endet hier. Schritt 2: „Task“ endet hier. Schritt 3: „User Task“ endet hier. Schritt 4: „Service Task“ endet hier. Schritt 5: „Send Task“ endet hier. Schritt 6: „Receive Task“ endet hier. Schritt 7: „Manual Task“ endet hier. Schritt 8: „Business Rule Task“ endet hier. Schritt 9: „Script Task“ endet hier. Schritt 10: „Call Activity“ endet hier. Schritt 11: „Endereignis T_End“ endet hier.</desc><rect x="80" y="60" width="640" height="400" fill="#ffffff" aria-hidden="true"/><g class="arctos-bpmn-layer"><g class="djs-element djs-shape" data-element-id="T_Plain" role="button" aria-label="Aufgabe „Task“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:Task" aria-hidden="true"><rect x="180" y="80" width="100" height="80" rx="10" ry="10" class="bpmn-outline bpmn-activity" fill="#ffffff" stroke="#12181f" stroke-width="2" data-border="thin"/><text font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, &quot;Liberation Sans&quot;, sans-serif" font-size="12" fill="#12181f" text-anchor="middle" dominant-baseline="alphabetic" class="djs-label" xml:space="preserve"><tspan x="230" y="116.5">Task</tspan></text></g></g><g class="djs-element djs-shape" data-element-id="T_User" role="button" aria-label="Benutzeraufgabe „User Task“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:UserTask" aria-hidden="true"><rect x="320" y="80" width="100" height="80" rx="10" ry="10" class="bpmn-outline bpmn-activity" fill="#ffffff" stroke="#12181f" stroke-width="2" data-border="thin"/><g transform="translate(326 86) scale(0.8)" class="bpmn-task-symbol" data-symbol="UserTask"><path d="M 10 1.5 A 4 4 0 1 1 10 9.5