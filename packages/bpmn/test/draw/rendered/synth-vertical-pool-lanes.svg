<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="860" height="660" viewBox="80 60 860 660" role="img" class="arctos-bpmn" aria-labelledby="arctos-bpmn-title" aria-describedby="arctos-bpmn-desc"><defs><marker id="arctos-sequenceflow-end-d20-0" viewBox="0 0 20 20" refX="11" refY="10" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 5 L 11 10 L 1 15 z" fill="#12181f" stroke="#12181f" stroke-width="1" stroke-linejoin="round" stroke-dasharray="10000 1"/></marker><marker id="arctos-messageflow-start-d20-1" viewBox="0 0 20 20" refX="5.5" refY="10" markerWidth="20" markerHeight="20" orient="auto" markerUnits="userSpaceOnUse"><circle cx="10" cy="10" r="3.5" fill="#ffffff" stroke="#12181f" stroke-width="1" stroke-dasharray="10000 1"/></marker><marker id="arctos-messageflow-end-d20-2" viewBox="0 0 20 20" refX="12" refY="10" markerWidth="20" markerHeight="20" orient="auto" markerUnits="userSpaceOnUse"><path d="M 4 5 L 12 10 L 4 15" fill="none" stroke="#12181f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10000 1"/></marker></defs><title id="arctos-bpmn-title">synth-vertical-pool-lanes</title><desc id="arctos-bpmn-desc">Der Prozess hat 2 Startereignisse: „Post“, „Startereignis Start_Buerger“. Schritt 1: „Post“ (Eingang) führt zu „Antrag pruefen“. Schritt 2: „Antrag pruefen“ (Eingang) führt zu „Vollstaendig?“. Schritt 3: „Vollstaendig?“ (Bescheid) führt zu „Bescheid erstellen“. Schritt 4: „Bescheid erstellen“ (Bescheid) führt zu „Zugestellt“. Schritt 5: „Zugestellt“ (Bescheid) endet hier. Schritt 6: „Startereignis Start_Buerger“ (Buerger) führt zu „Antrag einreichen“. Schritt 7: „Antrag einreichen“ (Buerger) verzweigt in 2 Pfade: nach „Endereignis End_Buerger“, bei „Antrag“ nach „Antrag pruefen“. Schritt 8: „E</desc><rect x="80" y="60" width="860" height="660" fill="#ffffff" aria-hidden="true"/><g class="arctos-bpmn-layer"><g class="djs-element djs-shape" data-element-id="Participant_Amt"