<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="740" height="540" viewBox="110 60 740 540" role="img" class="arctos-bpmn" aria-labelledby="arctos-bpmn-title" aria-describedby="arctos-bpmn-desc"><defs><marker id="arctos-sequenceflow-end-d13-0" viewBox="0 0 20 20" refX="11" refY="10" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 5 L 11 10 L 1 15 z" fill="#12181f" stroke="#12181f" stroke-width="1" stroke-linejoin="round"/></marker><marker id="arctos-messageflow-start-d13-1" viewBox="0 0 20 20" refX="6" refY="10" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><circle cx="6" cy="10" r="3.5" fill="#ffffff" stroke="#12181f" stroke-width="1"/></marker><marker id="arctos-messageflow-end-d13-2" viewBox="0 0 20 20" refX="11" refY="10" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 5 L 11 10 L 1 15" fill="#ffffff" stroke="#12181f" stroke-width="1" stroke-linejoin="round"/></marker></defs><title id="arctos-bpmn-title">synth-collaboration-pools-lanes</title><desc id="arctos-bpmn-desc">Der Prozess hat 2 Startereignisse: „Antrag eingegangen“, „Startereignis Start_Kunde“. Schritt 1: „Antrag eingegangen“ (Sachbearbeitung) führt zu „Antrag pruefen“. Schritt 2: „Antrag pruefen“ (Sachbearbeitung) führt zu „Entscheiden“. Schritt 3: „Entscheiden“ (Genehmigung) verzweigt in 2 Pfade: nach „Bearbeitet“, bei „Bescheid“ nach „Bescheid empfangen“. Schritt 4: „Bearbeitet“ (Genehmigung) endet hier. Schritt 5: „Bescheid empfangen“ (Kunde) führt zu „Endereignis End_Kunde“. Schritt 6: „Endereignis End_Kunde“ (Kunde) endet hier. Schritt 7: „Startereignis Start_Kunde“ (Kunde) führt zu „Antrag st</desc><rect x="110" y="60" width="740" height="540" fill="#ffffff" aria-hidden="true"/><g class="arctos-bpmn-layer"><g class="djs-element djs-shape" data-element-id="Participant_Bank" role="button" aria-label="Pool „Bank“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn: