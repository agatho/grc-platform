<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="344" height="120" viewBox="132 140 344 120" role="img" class="arctos-bpmn" aria-labelledby="arctos-bpmn-title" aria-describedby="arctos-bpmn-desc"><defs><marker id="arctos-sequenceflow-end-d18-0" viewBox="0 0 20 20" refX="11" refY="10" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 5 L 11 10 L 1 15 z" fill="#12181f" stroke="#12181f" stroke-width="1" stroke-linejoin="round"/></marker></defs><title id="arctos-bpmn-title">synth-nested-subprocesses</title><desc id="arctos-bpmn-desc">Der Prozess beginnt mit „Startereignis N_Start“. Schritt 1: „Startereignis N_Start“ führt zu „Ebene 1“. Schritt 2: „Ebene 1“ führt zu „Endereignis N_End“. Schritt 3: „Endereignis N_End“ endet hier.</desc><rect x="132" y="140" width="344" height="120" fill="#ffffff" aria-hidden="true"/><g class="arctos-bpmn-layer"><g class="djs-element djs-shape" data-element-id="Sub_L1" role="button" aria-label="Unterprozess „Ebene 1“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:SubProcess" aria-hidden="true"><rect x="240" y="160" width="120" height="80" rx="10" ry="10" class="bpmn-outline bpmn-activity" fill="#ffffff" stroke="#12181f" stroke-width="2" data-border="thin"/><g transform="translate(293 223) scale(1)" class="bpmn-activity-marker" data-marker="collapsed"><path d="M 0 0 L 14 0 L 14 14 L 0 14 z" fill="#ffffff" stroke="#12181f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 7 3 L 7 11" fill="none" stroke="#12181f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 3 7 L 11 7" fill="none" stroke="#12181f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><text font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, &quot;Liberation Sans&quot;, sans-serif" font-size="12" fill="#12181f" text-anchor="middle" dominant-baseline="alphabetic" class="djs-label" xml:space="preserve"><tspan x="300" y="196.5">Ebene 1</tspan></text></g></g><g class="djs-element djs-shape" data-element-id="N_Start" role="button" aria-label="Startereignis ohne Namen (N_Start)" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:StartEvent" aria-hidden="true"><circle cx="170" cy="200" r="18" class="bpmn-outline bpmn-event" fill="#ffffff" stroke="#12181f" stroke-width="2" data-border="thin"/></g></g><g class="djs-element djs-shape" data-element-id="N_End" role="button" aria-label="Endereignis ohne Namen (N_End)" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:EndEvent" aria-hidden="true"><circle cx="438" cy="200" r="18" class="bpmn-outline bpmn-event" fill="#ffffff" stroke="#12181f" stroke-width="4" data-border="thick"/></g></g><g class="djs-element djs-connection" data-element-id="NF_1" role="img" aria-label="Sequenzfluss von N_Start nach Ebene 1" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:SequenceFlow" aria-hidden="true"><path d="M 188 200 L 240 200" class="bpmn-outline bpmn-connection" fill="none" stroke="#12181f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arctos-sequenceflow-end-d18-0)"/></g></g><g class="djs-element djs-connection" data-element-id="NF_2" role="img" aria-label="Sequenzfluss von Ebene 1 nach N_End" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:SequenceFlow" aria-hidden="true"><path d="M 360 200 L 420 200" class="bpmn-outline bpmn-connection" fill="none" stroke="#12181f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arctos-sequenceflow-end-d18-0)"/></g></g></g></svg>
