<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="940" height="130" viewBox="105 40 940 130" role="img" class="arctos-bpmn" aria-labelledby="arctos-bpmn-title" aria-describedby="arctos-bpmn-desc"><defs><marker id="arctos-sequenceflow-end-d1-0" viewBox="0 0 20 20" refX="11" refY="10" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 5 L 11 10 L 1 15 z" fill="#12181f" stroke="#12181f" stroke-width="1" stroke-linejoin="round"/></marker></defs><title id="arctos-bpmn-title">repo-prd-procurement</title><desc id="arctos-bpmn-desc">Der Prozess beginnt mit „Bedarf erkannt“. Schritt 1: „Bedarf erkannt“ führt zu „Purchase Request erstellen“. Schritt 2: „Purchase Request erstellen“ führt zu „PR genehmigen“. Schritt 3: „PR genehmigen“ führt zu „Angebot einholen“. Schritt 4: „Angebot einholen“ führt zu „Bestellung aufgeben“. Schritt 5: „Bestellung aufgeben“ führt zu „Bestellung abgeschlossen“. Schritt 6: „Bestellung abgeschlossen“ endet hier.</desc><rect x="105" y="40" width="940" height="130" fill="#ffffff" aria-hidden="true"/><g class="arctos-bpmn-layer"><g class="djs-element djs-shape" data-element-id="Task_pr" role="button" aria-label="Benutzeraufgabe „Purchase Request erstellen“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:UserTask" aria-hidden="true"><rect x="240" y="60" width="120" height="80" rx="10" ry="10" class="bpmn-outline bpmn-activity" fill="#ffffff" stroke="#12181f" stroke-width="2" data-border="thin"/><g transform="translate(246 66) scale(0.8)" class="bpmn-task-symbol" data-symbol="UserTask"><path d="M 10 1.5 A 4 4 0 1 1 10 9.5 A 4 4 0 1 1 10 1.5 z" fill="#ffffff" stroke="#12181f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 2 19 C 2 12.5 6 10.5 10 10.5 C 14 10.5 18 12.5 18 19 z" fill="#ffffff" stroke="#12181f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 10 10.5 L 10 19" fill="none" stroke="#12181f" stroke-width="1" stroke-linecap="r