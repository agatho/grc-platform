tos-sequenceflow-end-d10-0)"/></g></g><g class="djs-element djs-connection" data-element-id="GF_P_2" role="img" aria-label="Sequenzfluss von Parallel nach Ereignisbasiert" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:SequenceFlow" aria-hidden="true"><path d="M 405 200 L 435 200 L 435 270 L 465 270" class="bpmn-outline bpmn-connection" fill="none" stroke="#12181f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arctos-sequenceflow-end-d10-0)"/></g></g><g class="djs-element djs-connection" data-element-id="GF_I_Default" role="img" aria-label="Sequenzfluss von Inklusiv nach Komplex" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:SequenceFlow" aria-hidden="true"><path d="M 515 130 L 610 130 L 610 175" class="bpmn-outline bpmn-connection" fill="none" stroke="#12181f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-flow="default" marker-start="url(#arctos-default-flow-start-d10-1)" marker-end="url(#arctos-sequenceflow-end-d10-0)"/></g></g><g class="djs-element djs-connection" data-element-id="GF_EB_1" role="img" aria-label="Sequenzfluss von Ereignisbasiert nach Komplex" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:SequenceFlow" aria-hidden="true"><path d="M 515 270 L 610 270 L 610 225" class="bpmn-outline bpmn-connection" fill="none" stroke="#12181f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arctos-sequenceflow-end-d10-0)"/></g></g><g class="djs-element djs-connection" data-element-id="GF_C_1" role="img" aria-label="Sequenzfluss von Komplex nach G_End" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:SequenceFlow" aria-hidden="true"><path d="M 635 200 L 702 200" class="bpmn-outline bpmn-connection" fill="none" stroke="#12181f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arctos-sequenceflow-end-d10-0)"/></g></g><g class="djs-element djs-label-shape" data-element-id="Gw_Exclusive_label" role="button" aria