<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="626" height="335" viewBox="132 85 626 335" role="img" class="arctos-bpmn" aria-labelledby="arctos-bpmn-title" aria-describedby="arctos-bpmn-desc"><defs><marker id="arctos-sequenceflow-end-d10-0" viewBox="0 0 20 20" refX="11" refY="10" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 5 L 11 10 L 1 15 z" fill="#12181f" stroke="#12181f" stroke-width="1" stroke-linejoin="round" stroke-dasharray="10000 1"/></marker><marker id="arctos-default-flow-start-d10-1" viewBox="0 0 20 20" refX="0" refY="10" markerWidth="20" markerHeight="20" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 14 L 10 6" fill="none" stroke="#12181f" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="10000 1"/></marker></defs><title id="arctos-bpmn-title">synth-all-gateway-types</title><desc id="arctos-bpmn-desc">Der Prozess beginnt mit „Startereignis G_Start“. Schritt 1: „Startereignis G_Start“ führt zu „Betrag &gt; 10.000?“. Schritt 2: „Betrag &gt; 10.000?“ verzweigt in 2 Pfade: bei „ja“ nach „Parallel“, bei „sonst“ nach „Endereignis G_End“. Schritt 3: „Parallel“ verzweigt in 2 Pfade: nach „Inklusiv“, nach „Ereignisbasiert“. Schritt 4: „Inklusiv“ führt zu „Komplex“. Schritt 5: „Komplex“ führt zu „Endereignis G_End“. Schritt 6: „Endereignis G_End“ endet hier. Schritt 7: „Ereignisbasiert“ führt zu „Komplex“.</desc><rect x="132" y="85" width="626" height="335" fill="#ffffff" aria-hidden="true"/><g class="arctos-bpmn-layer"><g class="djs-element djs-shape" data-element-id="Gw_Exclusive" role="button" aria-label="exklusives Gateway „Betrag &gt; 10.000?“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:ExclusiveGateway" aria-hidden="true"><path d="M 270 175 L 295 200 L 270 225 L 245 200 z" class="bpmn-outline bpmn-gateway" fill="#ffffff" stroke="#12181f" stroke-width="2" stroke-linejoin="round" data-border="thin"/><g transform="translate(259.5 189.5) scale(1.05)" class="bpmn-gateway-symbol" data-symbol="exclusive"><path d="M 3.4 0 L 10 6.6 L 16.6 0 L 20 3.4 L 13.4 10 L 20 16.6 L 16.6 20 L 10 13.4 L 3.4 20 L 0 16.6 L 6.6 10 L 0 3.4 z" fill="#12181f" stroke="#12181f" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="djs-element djs-shape" data-element-id="Gw_Parallel" role="button" aria-label="paralleles Gateway „Parallel“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:ParallelGateway" aria-hidden="true"><path d="M 380 175 L 405 200 L 380 225 L 355 200 z" class="bpmn-outline bpmn-gateway" fill="#ffffff" stroke="#12181f" stroke-width="2" stroke-linejoin="round" data-border="thin"/><g transform="translate(369.5 189.5) scale(1.05)" class="bpmn-gateway-symbol" data-symbol="parallel"><path d="M 7.6 0 L 12.4 0 L 12.4 7.6 L 20 7.6 L 20 12.4 L 12.4 12.4 L 12.4 20 L 7.6 20 L 7.6 12.4 L 0 12.4 L 0 7.6 L 7.6 7.6 z" fill="#12181f" stroke="#12181f" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="djs-element djs-shape" data-element-id="Gw_Inclusive" role="button" aria-label="inklusives Gateway „Inklusiv“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:InclusiveGateway" aria-hidden="true"><path d="M 490 105 L 515 130 L 490 155 L 465 130 z" class="bpmn-outline bpmn-gateway" fill="#ffffff" stroke="#12181f" stroke-width="2" stroke-linejoin="round" data-border="thin"/><g transform="translate(479.5 119.5) scale(1.05)" class="bpmn-gateway-symbol" data-symbol="inclusive"><path d="M 10 1.5 A 8.5 8.5 0 1 1 10 18.5 A 8.5 8.5 0 1 1 10 1.5 z" fill="none" stroke="#12181f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="djs-element djs-shape" data-element-id="Gw_EventBased" role="button" aria-label="ereignisbasiertes Gateway „Ereignisbasiert“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:EventBasedGateway" aria-hidden="true"><path d="M 490 245 L 515 270 L 490 295 L 465 270 z" class="bpmn-outline bpmn-gateway" fill="#ffffff" stroke="#12181f" stroke-width="2" stroke-linejoin="round" data-border="thin"/><g transform="translate(479.5 259.5) scale(1.05)" class="bpmn-gateway-symbol" data-symbol="eventBased"><path d="M 10 0.5 A 9.5 9.5 0 1 1 10 19.5 A 9.5 9.5 0 1 1 10 0.5 z" fill="none" stroke="#12181f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 10 2.5 A 7.5 7.5 0 1 1 10 17.5 A 7.5 7.5 0 1 1 10 2.5 z" fill="none" stroke="#12181f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 10 3.6 L 15.8 7.8 L 13.6 14.6 L 6.4 14.6 L 4.2 7.8 z" fill="none" stroke="#12181f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="djs-element djs-shape" data-element-id="Gw_Complex" role="button" aria-label="komplexes Gateway „Komplex“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:ComplexGateway" aria-hidden="true"><path d="M 610 175 L 635 200 L 610 225 L 585 200 z" class="bpmn-outline bpmn-gateway" fill="#ffffff" stroke="#12181f" stroke-width="2" stroke-linejoin="round" data-border="thin"/><g transform="translate(599.5 189.5) scale(1.05)" class="bpmn-gateway-symbol" data-symbol="complex"><path d="M 8.6 0 L 11.4 0 L 11.4 20 L 8.6 20 z M 0 8.6 L 20 8.6 L 20 11.4 L 0 11.4 z M 2.9 1 L 19 17.1 L 17.1 19 L 1 2.9 z M 17.1 1 L 19 2.9 L 2.9 19 L 1 17.1 z" fill="#12181f" stroke="#12181f" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="djs-element djs-shape" data-element-id="G_Start" role="button" aria-label="Startereignis ohne Namen (G_Start)" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:StartEvent" aria-hidden="true"><circle cx="170" cy="200" r="18" class="bpmn-outline bpmn-event" fill="#ffffff" stroke="#12181f" stroke-width="2" data-border="thin"/></g></g><g class="djs-element djs-shape" data-element-id="G_End" role="button" aria-label="Endereignis ohne Namen (G_End)" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:EndEvent" aria-hidden="true"><circle