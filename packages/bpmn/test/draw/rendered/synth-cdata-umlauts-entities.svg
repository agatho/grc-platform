ue&quot;, Helvetica, &quot;Liberation Sans&quot;, sans-serif" font-size="12" fill="#12181f" text-anchor="middle" dominant-baseline="alphabetic" class="djs-label bpmn-external-label" xml:space="preserve"><tspan x="170" y="224.6">Antrag</tspan><tspan x="170" y="239">eingegangen</tspan><tspan x="170" y="253.4">(Ö-Prüfstelle)</tspan></text></g></g><g class="djs-element djs-label-shape" data-element-id="U_Gw_label" role="button" aria-label="Beschriftung Bewilligt?" tabindex="-1"><g class="djs-visual" data-bpmn-type="label" aria-hidden="true"><text font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, &quot;Liberation Sans&quot;, sans-serif" font-size="12" fill="#12181f" text-anchor="middle" dominant-baseline="alphabetic" class="djs-label bpmn-external-label" xml:space="preserve"><tspan x="420" y="246">Bewilligt?</tspan></text></g></g><g class="djs-element djs-label-shape" data-element-id="U_End_Ja_label" role="button" aria-label="Beschriftung Bewilligt — Bescheid verschickt" tabindex="-1"><g class="djs-visual" data-bpmn-type="label" aria-hidden="true"><text font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, &quot;Liberation Sans&quot;, sans-serif" font-size="12" fill="#12181f" text-anchor="middle" dominant-baseline="alphabetic" class="djs-label bpmn-external-label" xml:space="preserve"><tspan x="540" y="144.6">Bewilligt —</tspan><tspan x="540" y="159">Bescheid</tspan><tspan x="540" y="173.4">verschickt</tspan></text></g></g><g class="djs-element djs-label-shape" data-element-id="U_End_Nein_label" role="button" aria-label="Beschriftung Abgelehnt (§ 44 BHO)" tabindex="-1"><g class="djs-visual" data-bpmn-type="label" aria-hidden="true"><text font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, &quot;Liberation Sans&quot;, sans-serif" font-size="12" fill="#12181f" text-anchor="middle" dominant-baseline="alphabetic" class="djs-label bpmn-external-label" xml:space="preserve"><tspan x="540" y="311.8">Abgelehnt (§ 44</tspan><tspan x="540" y="326.2">BHO)</tspan