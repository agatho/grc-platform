<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="500" height="330" viewBox="105 20 500 330" role="img" class="arctos-bpmn" aria-labelledby="arctos-bpmn-title" aria-describedby="arctos-bpmn-desc"><defs><marker id="arctos-sequenceflow-end-d12-0" viewBox="0 0 20 20" refX="11" refY="10" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 5 L 11 10 L 1 15 z" fill="#12181f" stroke="#12181f" stroke-width="1" stroke-linejoin="round" stroke-dasharray="10000 1"/></marker></defs><title id="arctos-bpmn-title">synth-cdata-umlauts-entities</title><desc id="arctos-bpmn-desc">Der Prozess beginnt mit „Antrag eingegangen (Ö-Prüfstelle)“. Schritt 1: „Antrag eingegangen (Ö-Prüfstelle)“ führt zu „Fördermittel prüfen &amp; bewilligen (&lt;=30 Tage)“. Schritt 2: „Fördermittel prüfen &amp; bewilligen (&lt;=30 Tage)“ führt zu „Bewilligt?“. Schritt 3: „Bewilligt?“ verzweigt in 2 Pfade: bei „ja &gt;= 80 %“ nach „Bewilligt — Bescheid verschickt“, bei „nein &lt; 80 %“ nach „Abgelehnt (§ 44 BHO)“. Schritt 4: „Bewilligt — Bescheid verschickt“ endet hier. Schritt 5: „Abgelehnt (§ 44 BHO)“ endet hier. Schritt 6: „„Typografische Anführungszeichen“, Gedankenstrich – und ein Emoji: ⚠“ endet hier.</desc><rect x="105" y="20" width="500" height="330" fill="#ffffff" aria-hidden="true"/><g class="arctos-bpmn-layer"><g class="djs-element djs-shape" data-element-id="U_Task" role="button" aria-label="Benutzeraufgabe „Fördermittel prüfen &amp; bewilligen (&lt;=30 Tage)“" tabindex="-1"><g class="djs-visual" data-bpmn-type="bpmn:UserTask" aria-hidden="true"><rect x="240" y="160" width="100" height="80" rx="10" ry="10" class="bpmn-outline bpmn-activity" fill="#ffffff" stroke="#12181f" stroke-width="2" data-border="thin"/><g transform="translate(246 166) scale(0.8)" class="bpmn-task-symbol" data-symbol="UserTask"><path d="M 10 1.5 A 4 4 0 1 1 10 9.5 A 4 4 0 1 1 10 1.5 z" fill="#ffffff" stroke="#12181f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="rou