name: Secret Scanning (ADR-018 Phase 0)

# Scans PR diffs + main branch for accidentally committed secrets.
# Uses gitleaks (fast, regex-based, zero config). GitHub's built-in
# secret scanning runs in parallel on pushes to public repos.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks needs full history to diff against main

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE -> runs in OSS mode (rate-limited but fine
          # for small repos)

  # ──────────────────────────────────────────────────────────────────────
  # [ARCTOS-FULL-2026-08-31 / WP10 · S08-15]
  #
  # Die beiden bestehenden Secret-Scans finden bauartbedingt nur einen Teil:
  #   * `trufflehog --only-verified` (ci.yml) meldet ausschliesslich
  #     Credentials, die per Live-Aufruf gegen den Anbieter bestaetigt
  #     werden koennen. Strukturell unsichtbar bleiben DB-Connection-Strings,
  #     Redis-/AMQP-Passwoerter, private Schluessel und alle Secrets selbst
  #     gehosteter Dienste (Garage, MinIO, ClamAV, FreeTSA) — also genau die
  #     Klasse, die diese Architektur ueberwiegend nutzt.
  #   * `gitleaks-action` scannt bei push/pull_request die jeweiligen
  #     Commits, nicht wiederkehrend den Gesamtverlauf. Ein Secret, das vor
  #     Einfuehrung des Workflows committet wurde, sah keine der beiden
  #     Kontrollen je.
  #
  # Dieser Job schliesst die Luecke: einmal woechentlich der VOLLSTAENDIGE
  # Historien-Scan ohne `--only-verified`, Ergebnis als Artefakt. Er laeuft
  # bewusst NICHT bei jedem PR — dort wuerde das Rauschen die Entwickler-
  # Rueckmeldung entwerten, was der urspruengliche Grund fuer
  # `--only-verified` war.
  # ──────────────────────────────────────────────────────────────────────
  full-history-scan:
    name: Full-history secret scan (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: trufflehog — entire history, unverified included
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        continue-on-error: true
        with:
          extra_args: --json --no-update
          path: ./
          base: ""
          head: ${{ github.ref_name }}

      - name: gitleaks — entire history, JSON report
        continue-on-error: true
        env:
          GITLEAKS_VERSION: 8.21.2
          # SHA-256 des offiziellen Release-Tarballs, verifiziert am 2026-09-01
          # (#S13-27: kein
          # ungepruefter Binary-Download in einem Sicherheitspruefschritt).
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "/tmp/${TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          # Die Pruefsumme ist bewusst NICHT `|| true`: schlaegt sie fehl,
          # bricht der Schritt ab. `continue-on-error` oben verhindert nur,
          # dass ein FUND den Workflow rot macht — der Report ist zur
          # Sichtung da, nicht als Gate.
          echo "${GITLEAKS_SHA256}  /tmp/${TARBALL}" | sha256sum -c - || {
            echo "::error::gitleaks-Tarball entspricht nicht der erwarteten Pruefsumme."
            echo "::error::Erwartet: ${GITLEAKS_SHA256}"
            echo "::error::Gemessen: $(sha256sum "/tmp/${TARBALL}" | cut -d' ' -f1)"
            echo "::error::Pruefsumme in diesem Workflow aktualisieren, wenn die"
            echo "::error::Version bewusst gewechselt wurde."
            exit 1
          }
          tar -xzf "/tmp/${TARBALL}" -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-git=false \
            --report-format json --report-path /tmp/gitleaks-history.json \
            --redact --exit-code 0
          echo "Funde: $(node -e "console.log(require('/tmp/gitleaks-history.json').length)" 2>/dev/null || echo '?')"

      - name: Upload full-history scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: secret-scan-history-${{ github.run_id }}
          path: |
            /tmp/gitleaks-history.json
          retention-days: 90
          if-no-files-found: warn

      # [WP10 · S08-14] Der repo-eigene Scanner mit den in S08-14
      # beschriebenen Korrekturen (Pfadpraefixe statt Basisnamen,
      # ergaenzte Muster). Er laeuft hier mit, damit sein Report nicht
      # dauerhaft dieselben sechs Testfixture-Falschpositive zeigt und
      # deshalb niemand mehr hinsieht.
      # [Welle 5b · OP-104-Nebenbefund, 2026-09-05] Dieser Schritt lief mit
      # `continue-on-error: true` UND `|| true`. Das Skript beendet sich mit
      # Exit 1, sobald ein CRITICAL-Treffer uebrig bleibt (audit-secrets.mjs
      # :569) — beide Abschaltungen zusammen haben genau das verworfen. Das
      # Tor konnte nicht ausloesen, und der eingecheckte Report
      # (`docs/security/secret-scan-report.md`) stammte vom 2026-09-01 und
      # meldete "3901 Dateien, 0 Funde".
      #
      # Neu gemessen am 2026-09-05 gegen 2f716205: 4420 Dateien, **2
      # CRITICAL** — beide in `packages/shared/tests/logger-scrubbing.test.ts`
      # :100. Es war die blosse KOPFZEILE eines RSA-Privatschluessels ohne
      # jedes Schluesselmaterial. Sie ist hier bewusst NICHT ausgeschrieben:
      # sonst meldet dieser Scanner seine eigene Dokumentation als Fund —
      # dieselbe Falle, die der Eintrag zu `access-log/page.tsx` in
      # `KNOWN_TEST_FIXTURES` schon benennt. (Genau so gemessen: nach dem
      # Eintragen der Ausnahme wanderten die zwei Treffer auf diese Datei.)
      # Sie kam mit Welle 4b-2 (OP-152) und wurde nicht in
      # `KNOWN_TEST_FIXTURES` aufgenommen; wegen `|| true` fiel es niemandem
      # auf.
      #
      # Der Schritt ist jetzt scharf, und die Fundstelle steht als bewertete
      # Ausnahme in `scripts/audit-secrets.mjs` KNOWN_TEST_FIXTURES: Die
      # Werte sind die EINGABEN des Tests, der beweist, dass der Scrubber
      # sie schwaerzt — faende der Scanner sie nicht, waere der Test
      # wertlos. Ein Tor, das nicht ausloesen kann, ist schaedlicher als
      # ein Tor, das etwas Bekanntes meldet: es hat diese Regression zwei
      # Wellen lang verdeckt.
      - name: Repo secret scanner (scripts/audit-secrets.mjs)
        run: node scripts/audit-secrets.mjs
