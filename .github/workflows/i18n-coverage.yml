name: i18n Coverage

# Zwei Tore, weil das eine nicht ausreichte.
#
# 1. DE/EN-Parity (unveraendert): messages/de/*.json gegen messages/en/*.json.
#
# 2. [ARCTOS-FULL-2026-08-31 / WP12 - S14-08] Code gegen Katalog.
#    Das bisherige Gate hat ausschliesslich messages/de und messages/en
#    miteinander verglichen und nie src/ geoeffnet. Deshalb blieben 21 im Code
#    verwendete, im Katalog nicht existierende Schluessel unbemerkt (S14-05) --
#    zwei davon auf dem Haupt-Dashboard, einer in einem aria-label. Ebenfalls
#    unbemerkt: der Namespace `frameworks` mit 61 Keys, der in
#    src/i18n/request.ts nie registriert war (S14-07), und jede Abweichung
#    zwischen den Namespace-Verzeichnissen und dem Runtime-Bundle
#    messages/{de,en}.json.
#
# Ebenfalls S14-08: der `paths:`-Filter liess das Gate nur laufen, wenn
# messages/** geaendert wurde. Ein PR, der eine neue t("...")-Verwendung ohne
# Katalogaenderung einfuehrt, startete es gar nicht erst -- genau der Weg, auf
# dem die 21 fehlenden Schluessel entstanden sind. Der Filter deckt jetzt auch
# apps/web/src ab.
#
# Konvention dokumentiert in docs/ADR-022-i18n-namespace-organization.md.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/messages/**"
      - "apps/web/src/**"
      - "apps/web/scripts/build-messages.ts"
      - "scripts/audit-i18n-coverage.mjs"
      - "scripts/audit-i18n-usage.mjs"
      - "scripts/i18n-key-inventory.mjs"
      - ".i18n-keys-ratchet.json"
      - ".github/workflows/i18n-coverage.yml"

permissions:
  contents: read

jobs:
  i18n-parity:
    name: DE/EN namespace parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Run i18n coverage audit
        run: node scripts/audit-i18n-coverage.mjs

      # ────────────────────────────────────────────────────────────────
      # [ARCTOS-FULL-2026-08-31 · Welle 8c] Kein Schluessel verschwindet
      # unbemerkt.
      #
      # Der Schritt darueber vergleicht DE gegen EN. Wird ein Schluessel in
      # BEIDEN Sprachen geloescht oder ueberschrieben, bleiben beide Seiten
      # deckungsgleich und er meldet nichts. Der Unused-Key-Ratchet weiter
      # unten meldet ebenfalls nichts, im Gegenteil: war der Schluessel
      # unbenutzt, SINKT dessen Zahl und der Check wird gruener.
      #
      # Damit war ein verschwundener Schluessel die einzige Aenderung am
      # Katalog, die kein Check sehen konnte — und zugleich die einzige, die
      # der Nutzer sofort sieht, naemlich als rohen Schluessel auf der Seite.
      # Gemessen: in Welle 8b sind so 24 `esgAdvanced.materiality.*`-Eintraege
      # ueberschrieben worden, beide Sprachen, alle Checks gruen.
      #
      # Gegenprobe zu diesem Schritt: bei einer symmetrischen Loeschung endet
      # `audit-i18n-coverage.mjs` mit Exit 0, `i18n-key-inventory.mjs --check`
      # mit Exit 1.
      #
      # Wachsen darf der Bestand frei. Eine Absenkung ist nicht verboten, aber
      # begruendungspflichtig:
      #   node scripts/i18n-key-inventory.mjs --update --reason "..."
      # ────────────────────────────────────────────────────────────────
      - name: Kein Schluesselverlust im Katalog
        run: node scripts/i18n-key-inventory.mjs --check

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: i18n-coverage-report
          path: docs/i18n-coverage-report.md
          retention-days: 30

      # ────────────────────────────────────────────────────────────────
      # [ARCTOS-FULL-2026-08-31 / WP10 · S08-26]
      #
      # Diese vier Zaehler waren FAIL-OPEN. `grep -oE ... || echo 0` liefert
      # bei fehlender Datei einen sauberen "0", weil `grep` mit Status 2
      # endet und `|| echo 0` einspringt — die Bedingung `0 -gt 0` ist
      # falsch, der Schritt endet gruen. Die Kontrolle bestaetigte dann
      # Konformitaet, obwohl sie NICHTS geprueft hatte. Bei vorhandener,
      # aber trefferloser Datei entstand ausserdem der Wert "0\n0", woran
      # `[ -gt ]` mit "integer expression expected" scheiterte — im `if`
      # von `bash -e` ausgenommen, also ebenfalls gruen.
      #
      # Fix in drei Schritten: (1) Existenz des Reports erzwingen,
      # (2) Auslesen so, dass genau EIN Wert entsteht, (3) pruefen, dass
      # jeder Zaehler ueberhaupt gefunden wurde — ein umbenannter
      # Report-Abschnitt darf nicht als "alles gut" durchgehen.
      # ────────────────────────────────────────────────────────────────
      - name: Fail if missing keys or placeholders
        run: |
          set -euo pipefail
          REPORT="docs/i18n-coverage-report.md"
          if [ ! -f "$REPORT" ]; then
            echo "::error::$REPORT fehlt — der vorgelagerte Generator hat nichts"
            echo "::error::geschrieben. Ein fehlender Report ist ein FEHLER, kein"
            echo "::error::Freibrief (#S08-26)."
            exit 1
          fi

          read_counter() {
            local label="$1" value
            value="$(grep -oE "${label}: [0-9]+" "$REPORT" | grep -oE '[0-9]+' | head -n1 || true)"
            if [ -z "$value" ]; then
              echo "::error::Kennzahl \"${label}\" steht nicht in $REPORT." >&2
              echo "::error::Der Report-Aufbau hat sich geaendert — diese Pruefung" >&2
              echo "::error::wuerde sonst stillschweigend nichts mehr messen." >&2
              return 1
            fi
            printf '%s' "$value"
          }

          MISSING_EN="$(read_counter 'Fehlende EN-Uebersetzungen')"
          MISSING_DE="$(read_counter 'Fehlende DE-Uebersetzungen')"
          PH_DE="$(read_counter 'Placeholder-Werte DE')"
          PH_EN="$(read_counter 'Placeholder-Werte EN')"
          echo "Missing EN: $MISSING_EN, Missing DE: $MISSING_DE, Placeholder DE: $PH_DE, Placeholder EN: $PH_EN"

          FAIL=0
          for v in "$MISSING_EN" "$MISSING_DE" "$PH_DE" "$PH_EN"; do
            if [ "$v" -gt 0 ]; then FAIL=1; fi
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::i18n parity broken -- siehe i18n-coverage-report artifact."
            exit 1
          fi
          echo "i18n-Paritaet OK (alle vier Kennzahlen gelesen und 0)."

  i18n-code-vs-catalog:
    name: Code vs. catalogue (S14-05, S14-07, S14-08)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Das Runtime-Bundle ist Build-Ausgabe. Es wird hier frisch erzeugt, damit
      # der Drift-Check gegen den Stand des PR prueft und nicht gegen ein
      # eingechecktes, moeglicherweise veraltetes Bundle -- und damit die
      # Reproduzierbarkeit im letzten Schritt nachgewiesen werden kann.
      - name: Rebuild message bundles
        run: npx tsx apps/web/scripts/build-messages.ts

      - name: Fail on keys used in code but missing from the catalogue
        run: node scripts/audit-i18n-usage.mjs

      # Ungenutzte Schluessel sind kein Fehler, sondern eine Ratsche. Die Zahl
      # darf sinken, nicht steigen; beim Absenken diesen Wert nachziehen.
      #
      # [ARCTOS-FULL-2026-08-31 · OP-073] Von 6.800 auf 2.166, und das ist
      # keine Lockerung durch Loeschen, sondern eine Korrektur des Zaehlers.
      # Zwei gemessene Befunde am Detektor, beide in
      # scripts/audit-i18n-usage.mjs behoben und dort ausfuehrlich begruendet:
      #
      #   1. `common.json` steht durch die Merge-Regel aus src/i18n/request.ts
      #      ZWEIMAL im Nachrichtenbaum (Wurzel und `common`). Von 12.956
      #      gezaehlten "Nachrichten" waren 4.340 Phantome; 4.331 der 6.805
      #      gemeldeten Eintraege waren nichts als diese Doppelung.
      #   2. 35 Aufrufstellen reichen den Schluessel als Variable durch
      #      (`t(item.labelKey)`). Darunter die Seitenleiste: 204 der 205
      #      Schluessel aus components/layout/nav-config.ts und 113 von 113
      #      aus module-tab-config.ts standen auf der Liste der "nie
      #      erreichten" -- die Beschriftungen der gesamten Navigation.
      #
      # Nebenbefund: die Ratsche war beim Messen am 2026-09-03 mit 6.805
      # gegen Budget 6.800 ROT. Die Korrektur ersetzt sie nicht, sie macht
      # sie erst pruefbar.
      #
      # Von den verbleibenden 2.166 sind fuenf ganze Namespaces
      # (`ermEvaluation`, `bpmDerived`, `grcUx`, `frameworks` und Teile von
      # `abac`) nachweislich unerreicht -- das ist Katalogpflege und gehoert
      # nicht in diese Welle; siehe docs/UMSETZUNG-WELLE-4C.md §4.
      #
      # [Welle 5a · OP-070] 2166 -> 2133. Reine Absenkung durch Arbeit:
      # 185 der gezaehlten Schluessel standen wortgleich als Literal in
      # genau den Seiten, die die zweite Ratsche als "ohne i18n" fuehrt --
      # `portal.*` (41), `wbPortal.*` (23) und `ddResults.*` (4) waren
      # vollstaendig in beiden Sprachen da und von NULL Aufrufstellen
      # erreicht. Das ist der dritte unabhaengige Grund, warum die Liste
      # aus OP-073 keine Loeschliste ist.
      #
      # [Welle 8b] 2133 -> 2104. Zwei Ursachen, beide gemessen:
      # (a) Die 11 Seiten aus OP-202 haben Katalogknoten angeschlossen, die
      #     laengst in beiden Sprachen dalagen und von einer hartkodierten
      #     deutschen Zweitfassung verdraengt wurden --
      #     `dpms.tia.legalBasisValues.*`, `assets.tiers.*`,
      #     `isms.vulnerabilityStatus.*`. Das ist derselbe Befund wie in
      #     Welle 5a; fuer die Bereiche der Welle 6b traf er nicht zu.
      # (b) `bpmn.chrome.disabledReason` galt seit Welle 7b als nie erreicht:
      #     der Aufruf lief ueber `tRef.current`, und der Zaehler erkennt
      #     eine Aufrufstelle nur an der direkten Form der Bindung. Der
      #     Schluessel WAR benutzt -- das Budget 2133 war auf 66de0a95
      #     trotzdem rot (2134). Behoben in der Komponente, nicht im Budget.
      # Beide Richtungen geprueft: gruen bei 2128, rot bei 2127.
      - name: Unused-key ratchet
        run: node scripts/audit-i18n-usage.mjs --max-unused 2128

      # [WP12 - S14-14] Zweite Ratsche: Dateien, die Text zeigen, ihn aber nicht
      # uebersetzen. Stand 2026-09-02: 78 von 482 Pages und 73 von 134
      # Komponenten, darunter 10 der 14 EU-AI-Act-Seiten (hartcodiert deutsch).
      # Das Uebersetzen ist Produktinhalt und laeuft ausserhalb dieser
      # Remediation; die Zahl darf dabei sinken, nicht steigen. Beim Absenken
      # hier nachziehen.
      #
      # [OP-071] Von 169 auf 151, und das ist keine Absenkung durch Arbeit,
      # sondern eine Praezisierung des Massstabs: 19 der gezaehlten Dateien
      # waren Weiterleitungen und Re-Exporte von unter 16 Zeilen ohne einen
      # einzigen Textknoten -- sie konnten nichts hartcodieren. Der Zaehler
      # verlangt jetzt zusaetzlich einen sichtbaren Text (JSX-Textknoten oder
      # satzfoermiges Literal); siehe `showsLiteralText` in
      # scripts/audit-i18n-usage.mjs. Real uebersetzt wurde in diesem Schritt
      # `components/bpmn/grc-view-select.tsx`.
      #
      # [Welle 5a · OP-070] 151 -> 131 (20 Dateien umgestellt). Beide
      # Werte sind nachgeprueft: gruen beim gesetzten Wert, rot eins
      # darunter. Die ehrliche Restschuld ist 118, nicht 131: 13 der
      # gezaehlten Dateien zeigen gar keinen Text, der Zaehler nimmt dort
      # Tailwind-Klassenketten fuer Saetze. Das ist beziffert statt
      # behoben -- siehe docs/UMSETZUNG-WELLE-5A.md.
      - name: i18n-Abdeckungs-Ratsche
        #
        # [Welle 6b] 107 -> 118. Die Zahl STEIGT, und das ist der Fortschritt:
        # Der Zaehler hielt bisher jede Datei fuer uebersetzt, in der das Wort
        # `useTranslations` VORKAM. 19 Dateien schrieben
        # `const _t = useTranslations("aiAct");` und benutzten die Bindung nie
        # — der fuehrende Unterstrich brachte zugleich `no-unused-vars` zum
        # Schweigen. Zwei Tore mit EINEM Zeichen ausgehebelt. Angebunden ist
        # eine Datei jetzt erst, wenn mindestens eine Bindung auch AUFGERUFEN
        # wird; siehe `bindsButNeverCalls` in scripts/audit-i18n-usage.mjs.
        # 118 ist damit die erste ehrliche Zahl dieser Ratsche. Beide
        # Richtungen geprueft: gruen bei 118, rot bei 117.
        #
        # [Welle 8b · OP-202] 118 -> 107. Die 11 Dateien mit Scheinbindung
        # ausserhalb `ai-act` sind umgestellt; das war der ganze Rest der
        # Klasse, die Welle 6b beziffert hat. Zusaetzlich sind drei tote
        # Bindungen NEBEN einer benutzten entfernt worden
        # (`processes/[id]`, `processes`, `work-items/[id]`) -- die sieht
        # `bindsButNeverCalls` nicht, weil es verlangt, dass ALLE Bindungen
        # einer Datei tot sind; `wave8b-surfaces.test.ts` §4 prueft das
        # schaerfer und ohne Ausnahme. Beide Richtungen geprueft: gruen bei
        # 107, rot bei 106.
        run: node scripts/audit-i18n-usage.mjs --max-untranslated 107

      # [OP-072] Hier stand ein Schritt "messages/{de,en}.json muessen
      # reproduzierbar sein", der `git diff` auf genau diese zwei Dateien rief.
      # Sie stehen seit jeher in .gitignore (Zeile 35/36) und sind damit
      # untracked -- `git diff` auf einen untracked Pfad ist immer leer, der
      # Schritt konnte nie fehlschlagen. Ein Tor, das nicht fehlschlagen kann,
      # ist schlimmer als keins: es steht gruen im Protokoll.
      #
      # Ersatzlos entfernt, weil der eigentliche Nachweis eine Zeile hoeher
      # bereits gefuehrt wird: die Buendel werden oben frisch gebaut, und
      # `audit-i18n-usage.mjs` vergleicht sie gegen einen **eigenen**, von
      # build-messages.ts unabhaengigen Nachbau der Merge-Regel aus
      # src/i18n/request.ts (`buildCatalogue`). Genau das ist die Frage, die
      # zaehlt -- ob Bau- und Laufzeitpfad dasselbe Buendel ergeben.
