# ============================================================================
# ARCTOS GRC Platform — CI Pipeline
# Trigger: Push on main/develop, Pull Requests
# Jobs: Lint → Unit Tests → Integration Tests → DB Integrity → Build → Security
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Dummy values so Next.js build doesn't fail on missing env
  AUTH_SECRET: ci-build-placeholder
  AUTH_TRUST_HOST: "true"
  # [ARCTOS-FULL-2026-08-31 / WP10 · S08-09]
  # TURBO_TOKEN stand hier workflow-weit und war damit jedem Schritt
  # zugaenglich — auch `npm ci`, das per Design fremden Code ausfuehrt. Ein
  # kompromittiertes Paket haette den Token im `postinstall` gelesen und
  # exfiltriert; wer in den Turbo-Remote-Cache schreiben kann, vergiftet die
  # Build-Artefakte aller nachfolgenden Laeufe und damit die produzierten
  # Images. Der Token wird jetzt NUR noch auf den Schritten gesetzt, die
  # turbo tatsaechlich aufrufen (`npx turbo test`). TURBO_TEAM ist keine
  # Geheimnis-Variable und darf bleiben.
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────
  # 1. Lint, type-check, format
  # ────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # [WP10 · S08-09/S08-19] Lifecycle-Skripte des gesamten Baums nicht
      # ausfuehren; die zwei Pakete des Produktionsbaums, die tatsaechlich
      # Code ausfuehren, gezielt nachziehen. Identisch zum Dockerfile.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild @parcel/watcher @swc/core --foreground-scripts 2>/dev/null || true

      - name: ESLint (apps/web)
        working-directory: apps/web
        run: npx eslint . --no-error-on-unmatched-pattern

      # [WP10 · S13-17] Bis zum Audit lief ESLint in genau EINEM von zwoelf
      # Workspaces. `apps/worker` (132 Dateien) und alle zehn Packages waren
      # ungelintet, weil sie kein `lint`-Skript hatten und `turbo lint`
      # Workspaces ohne Task stillschweigend ueberspringt. Alle zwoelf haben
      # jetzt ein `lint`-Skript; die elf Nicht-Web-Workspaces laufen gegen
      # eslint.config.mjs im Repo-Root. Der Altbestand (253 ungenutzte
      # Bindungen, 121 console.*, 33 any) ist in .eslint-ratchet.json
      # eingefroren statt per `off` unsichtbar gemacht — die Zahlen duerfen
      # nur sinken, jede NEUE Regelverletzung failt.
      - name: ESLint ratchet (apps/worker, packages/*, scripts/*)
        run: node scripts/lint-ratchet.mjs

      - name: Prettier (format check)
        run: npx prettier --check "**/*.{ts,tsx,js,json,md}" --ignore-path .gitignore

      - name: TypeScript (type check — web)
        run: npx tsc --noEmit -p apps/web/tsconfig.json
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: TypeScript (type check — worker)
        run: npx tsc --noEmit -p apps/worker/tsconfig.json

      # [ARCTOS-FULL-2026-08-31 / WP12 · S14-25] The two steps above were the
      # WHOLE type-check. Six of the twelve workspace packages had no
      # tsconfig.json at all (`tsc -p tsconfig.json` → TS5058) and four more had
      # one that CI never invoked — so `packages/shared` (all Zod schemas and
      # state machines), `packages/db` (the data model) and `packages/auth`
      # (RBAC, OIDC, SAML, SCIM) were verified only as far as apps/web and
      # apps/worker happened to import them. The loop is discovery-driven: a
      # new package is covered the day it gets a tsconfig.json, and one that
      # loses it fails here rather than dropping out silently.
      - name: TypeScript (type check — all workspace packages)
        run: |
          set -euo pipefail
          failed=0
          for cfg in packages/*/tsconfig.json; do
            pkg="$(basename "$(dirname "$cfg")")"
            echo "::group::tsc $pkg"
            if npx tsc --noEmit -p "$cfg"; then
              echo "$pkg OK"
            else
              echo "::error::TypeScript errors in packages/$pkg"
              failed=1
            fi
            echo "::endgroup::"
          done
          # Every package must HAVE a config — S14-25 was the absence, not the
          # errors. A new package without one is the regression to catch.
          for dir in packages/*/; do
            if [ ! -f "$dir/tsconfig.json" ]; then
              echo "::error::$dir has no tsconfig.json and is therefore never type-checked (S14-25)."
              failed=1
            fi
          done
          exit "$failed"

      # [WP10 · S08-05/S08-08] Die Zusage "pin all GitHub Actions by commit
      # SHA" stand als Kommentar in coverage.yml, waehrend 42 von 50 Refs an
      # beweglichen Tags hingen — darunter aquasecurity/trivy-action@master
      # in einem Job mit `packages: write`. Sie ist jetzt geprueft.
      - name: All GitHub Actions pinned by commit SHA
        run: node scripts/check-action-pinning.mjs

      # [WP10 · S13-28] `.env.example` deckte 49 tatsaechlich gelesene
      # Variablen nicht ab, und die einzige, die RLS aktiviert
      # (APP_DATABASE_URL), war auskommentiert ausgeliefert.
      - name: .env.example covers every variable the code reads
        run: node scripts/check-env-example.mjs

      # [OP-066] Zweimal ist eine Tor-Eingabe durch .gitignore aus dem
      # Repository gefallen (C-15: drei API-Routen; OP-066: die
      # Coverage-Ratsche, wodurch der Coverage-Workflow dauerhaft rot war).
      # Dieser Schritt prueft, dass jede Datei, die ein Tor als eingecheckten
      # Stand liest, auch wirklich eingecheckt ist.
      - name: Jede Tor-Eingabe steht im Repository
        run: node scripts/check-gate-inputs.mjs

  # ────────────────────────────────────────────────
  # 2. Unit tests with coverage
  # ────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # [WP10 · S08-09/S08-19] Lifecycle-Skripte des gesamten Baums nicht
      # ausfuehren; die zwei Pakete des Produktionsbaums, die tatsaechlich
      # Code ausfuehren, gezielt nachziehen. Identisch zum Dockerfile.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild @parcel/watcher @swc/core --foreground-scripts 2>/dev/null || true

      - name: Run tests
        run: npx turbo test -- --reporter=verbose --coverage
        env:
          # [WP10 · S08-09] Nur hier — turbo ist der einzige Verbraucher.
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            apps/web/coverage/
            packages/*/coverage/
          retention-days: 14

  # ────────────────────────────────────────────────
  # 3. Integration tests (with PostgreSQL + TimescaleDB)
  # ────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: grc
          POSTGRES_PASSWORD: grc_test_password
          POSTGRES_DB: grc_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grc -d grc_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --shm-size 256mb

    env:
      DATABASE_URL: postgresql://grc:grc_test_password@localhost:5432/grc_platform_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # [WP10 · S08-09/S08-19] Lifecycle-Skripte des gesamten Baums nicht
      # ausfuehren; die zwei Pakete des Produktionsbaums, die tatsaechlich
      # Code ausfuehren, gezielt nachziehen. Identisch zum Dockerfile.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild @parcel/watcher @swc/core --foreground-scripts 2>/dev/null || true

      - name: Setup PostgreSQL extensions
        run: |
          PGPASSWORD=grc_test_password psql -h localhost -U grc -d grc_platform_test -c "
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
            -- [ARCTOS-FULL-2026-08-31 / WP1] pgvector wird von 0050, 0356,
            -- 0368 und 0377 gebraucht. Solange CI das Schema ueber
            -- create-missing-tables.ts zusammenstueckelte, fiel das nicht auf.
            CREATE EXTENSION IF NOT EXISTS vector;
          "

      # [ARCTOS-FULL-2026-08-31 / WP1 · S09-02, S09-03, S13-01]
      # Vorher baute CI das Schema auf einem eigenen, dritten Weg:
      # `drizzle-kit migrate` (nur 25 Journal-Dateien) + eine Shell-Schleife
      # mit `|| true` (verschluckt jeden Fehler) + `create-missing-tables.ts`
      # (legt fehlende Tabellen ohne FK, Index, Constraint, Enum und RLS an).
      # Ergebnis: CI validierte ein Schema, das in keiner Umgebung existierte,
      # und BASE-002 war hier per Bauart unsichtbar. CI benutzt jetzt denselben
      # Runner wie Dev, DR und Audit; der Entrypoint fuehrt dieselbe Sequenz
      # aus. Ein Fehlschlag bricht den Job ab.
      - name: Build schema from migrations
        working-directory: packages/db
        run: DATABASE_URL="postgresql://grc:grc_test_password@localhost:5432/grc_platform_test" npx tsx src/migrate-all.ts

      # [WP10, uebernommen aus WP2/S01-09 und WP9] Beide Laufzeitrollen
      # werden hier mit demselben Skript angelegt, das auch im Deploy laeuft
      # (deploy/provision-grc-app.sh) — vorher legte CI `grc_app` mit einem
      # handgeschriebenen GRANT-Block an und kannte `grc_worker` gar nicht.
      # Damit testete CI eine Rechtelage, die es in Produktion nicht gibt.
      - name: Provision grc_app + grc_worker roles (same script as deploy)
        env:
          DIRECT_PSQL: "1"
          PGHOST: localhost
          PGUSER: grc
          PGPASSWORD: grc_test_password
          GRC_APP_PASSWORD: grc_app_dev_password
          GRC_WORKER_PASSWORD: grc_worker_dev_password
        run: bash deploy/provision-grc-app.sh grc_platform_test

      # [WP10, uebernommen aus WP2/S01-15] Das RLS-Coverage-Werkzeug misst
      # gegen die LAUFENDE Datenbank. Ohne diesen Schritt kann die
      # Remediation ihre eigene Mandantentrennung nicht absichern.
      #
      # Bewusst NICHT `--check`: dieser Modus vergleicht den erzeugten Report
      # zeichengenau mit der eingecheckten Fassung, und deren Kopfzeile
      # enthaelt den DATENBANKNAMEN der Maschine, auf der sie erzeugt wurde
      # (`wp2_verify`). In CI heisst die Datenbank `grc_platform_test`, der
      # Vergleich kann also nie aufgehen. Das ist an WP2 gemeldet
      # (scripts/audit-rls-coverage.mjs, Report-Kopf). Bis dahin wird hier
      # das geprueft, worauf es ankommt: NULL Luecken gegen die frisch
      # migrierte Datenbank — ein Ergebnis, das umgebungsunabhaengig gilt.
      - name: RLS coverage — zero gaps against the freshly migrated DB
        env:
          DATABASE_URL: postgresql://grc:grc_test_password@localhost:5432/grc_platform_test
        run: |
          node scripts/audit-rls-coverage.mjs | tee /tmp/rls-coverage.txt
          # Spalte 7 ist `status`; Spalte 8 (`defects`) ist der letzte Wert.
          GAPS=$(awk -F, 'NR>1 && $7 != "OK" && $7 != "PLATFORM_EXEMPT" {n++} END{print n+0}' \
            docs/security/rls-coverage-report.csv)
          echo "RLS-Luecken: $GAPS"
          if [ "$GAPS" -ne 0 ]; then
            echo "::error::$GAPS Objekte ohne wirksame RLS — siehe docs/security/rls-coverage-report.md"
            exit 1
          fi

      - name: Upload RLS coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rls-coverage-report
          path: |
            docs/security/rls-coverage-report.md
            docs/security/rls-coverage-report.csv
          retention-days: 30

      - name: Integration tests
        working-directory: packages/db
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://grc:grc_test_password@localhost:5432/grc_platform_test

      - name: RLS isolation tests
        working-directory: packages/db
        run: npm run test:rls
        env:
          DATABASE_URL: postgresql://grc:grc_test_password@localhost:5432/grc_platform_test
          # #SEC-F01b: point the GLOBAL `db` (packages/db) at the non-superuser
          # grc_app so request-scoped-context.test.ts exercises the exact pool a
          # real route uses and proves RLS is enforced through the `db` proxy.
          # (The other RLS tests use their own helper clients and ignore this.)
          APP_DATABASE_URL: postgresql://grc_app:grc_app_dev_password@localhost:5432/grc_platform_test

      # [WP10, uebernommen aus WP9] apps/worker/tests/lib/job-runtime.db.test.ts
      # belegt Lock, Atomaritaet und Dedup der Job-Laufzeit und lief bisher
      # in KEINEM Workflow: ohne DATABASE_URL meldet die Suite
      # `describe.skip` — ein stiller Skip (S11-02). Der Worker verbindet
      # hier als `grc_worker`, also mit derselben Rolle wie in Produktion.
      # [WP11 · gemessen] APP_DATABASE_URL stand hier auf grc_worker. Diese
      # Rolle hat BYPASSRLS — unter ihr laufen 13 RLS-Tests gruen durch, die
      # fehlschlagen MUESSTEN, weil grc_worker genau das abschaltet, was sie
      # pruefen. Die drei Rollen sind nicht austauschbar:
      #   DATABASE_URL        = grc         (Migrationen, Seeds, Fixtures)
      #   APP_DATABASE_URL    = grc_app     (alles, was RLS beweisen soll)
      #   WORKER_DATABASE_URL = grc_worker  (Worker-Laufzeit, wie in Produktion)
      # apps/worker/tests/require-db.mjs bildet WORKER_DATABASE_URL
      # prozesslokal auf APP_DATABASE_URL ab, damit beides nebeneinander geht.
      - name: Worker runtime integration tests (lock, atomicity, dedup)
        working-directory: apps/worker
        run: npm test
        env:
          DATABASE_URL: postgresql://grc:grc_test_password@localhost:5432/grc_platform_test
          WORKER_DATABASE_URL: postgresql://grc_worker:grc_worker_dev_password@localhost:5432/grc_platform_test
          ARCTOS_ALLOW_PRIVILEGED_DB: "true"
          CRON_SECRET: ci-cron-secret-not-a-real-value
          AUTH_SECRET: ci-build-placeholder

      - name: Route-chain RLS test (real withErrorHandler→withAuth→db)
        # #SEC-F01b-RUN — drives the REAL Next route pipeline (withErrorHandler →
        # withAuth → establishRequestScopedContext → requireModule → route db
        # reads) under grc_app, inside an outer async-context frame that emulates
        # the Next App Router. RED before the run()+mutate fix (0 rows), GREEN
        # after (org rows + cross-tenant isolation). This is the coverage the
        # isolated request-context primitives tests never had.
        working-directory: apps/web
        run: npm run test:rls
        env:
          DATABASE_URL: postgresql://grc:grc_test_password@localhost:5432/grc_platform_test
          APP_DATABASE_URL: postgresql://grc_app:grc_app_dev_password@localhost:5432/grc_platform_test
          AUTH_SECRET: ci-build-placeholder
          AUTH_TRUST_HOST: "true"

  # ────────────────────────────────────────────────
  # 3b. E2E smoke — release gate
  # ────────────────────────────────────────────────
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: grc
          POSTGRES_PASSWORD: grc_test_password
          POSTGRES_DB: grc_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grc -d grc_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --shm-size 256mb

    env:
      DATABASE_URL: postgresql://grc:grc_test_password@localhost:5432/grc_platform_test
      AUTH_SECRET: e2e-ci-secret-do-not-use-in-prod
      AUTH_TRUST_HOST: "true"
      E2E_BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # [WP10 · S08-09/S08-19] Lifecycle-Skripte des gesamten Baums nicht
      # ausfuehren; die zwei Pakete des Produktionsbaums, die tatsaechlich
      # Code ausfuehren, gezielt nachziehen. Identisch zum Dockerfile.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild @parcel/watcher @swc/core --foreground-scripts 2>/dev/null || true

      - name: Setup PostgreSQL extensions
        run: |
          PGPASSWORD=grc_test_password psql -h localhost -U grc -d grc_platform_test -c "
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE EXTENSION IF NOT EXISTS timescaledb;
          "

      # [ARCTOS-FULL-2026-08-31 / WP1 · S09-02, S09-03, S13-01]
      # Vorher baute CI das Schema auf einem eigenen, dritten Weg:
      # `drizzle-kit migrate` (nur 25 Journal-Dateien) + eine Shell-Schleife
      # mit `|| true` (verschluckt jeden Fehler) + `create-missing-tables.ts`
      # (legt fehlende Tabellen ohne FK, Index, Constraint, Enum und RLS an).
      # Ergebnis: CI validierte ein Schema, das in keiner Umgebung existierte,
      # und BASE-002 war hier per Bauart unsichtbar. CI benutzt jetzt denselben
      # Runner wie Dev, DR und Audit; der Entrypoint fuehrt dieselbe Sequenz
      # aus. Ein Fehlschlag bricht den Job ab.
      - name: Build schema from migrations
        working-directory: packages/db
        run: DATABASE_URL="postgresql://grc:grc_test_password@localhost:5432/grc_platform_test" npx tsx src/migrate-all.ts

      - name: Run seed (admin user + demo data)
        working-directory: packages/db
        run: npx tsx src/seed.ts

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start web server (background)
        working-directory: apps/web
        run: |
          npm start > /tmp/web-server.log 2>&1 &
          echo $! > /tmp/web-server.pid
          # Wait up to 90 s for /login to answer
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then
              echo "web server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "web server failed to start — tail of log:"
          tail -200 /tmp/web-server.log
          exit 1

      # [ARCTOS-FULL-2026-08-31 / WP10 · S13-18, abgestimmt mit WP11 · S11-06]
      # Hier lief `npx playwright test e2e/ci-smoke.spec.ts` — EINE von
      # inzwischen 68 Spec-Dateien. Der Job heisst "E2E Smoke Tests" und wird
      # in ADR-016 als Release-Gate gefuehrt; er validierte ~1,5 % der
      # vorhandenen Abdeckung, waehrend die uebrigen Specs in keinem Workflow
      # liefen und beliebig verrotten konnten. Der aufwendigste CI-Job
      # (voller Next-Build, Seed, Browser-Installation) lief also fast umsonst.
      #
      # Zuerst der schnelle Rauchtest — schlaegt er fehl, ist der Rest
      # Zeitverschwendung. Danach die vollstaendige Suite ueber die
      # WURZEL-Config: die deckt apps/web/e2e UND tests/e2e/regression ab
      # (195 Tests in 68 Dateien, 3 Projekte). Die frueher hier benutzte
      # apps/web-Config kannte nur deren 21 Specs.
      - name: Run Playwright smoke (fast fail)
        working-directory: apps/web
        run: npx playwright test e2e/ci-smoke.spec.ts --reporter=list

      # E2E_EMAIL/E2E_PASSWORD kommen aus Repository-Secrets. Der frueher
      # hartkodierte Login `admin@arctos.dev / admin123` ist mit WP3/S02-01
      # entfallen; `auth.setup.ts` bricht ohne diese Werte mit einer klaren
      # Meldung ab, statt an einem Selektor zu scheitern. Sind die Secrets
      # nicht gesetzt, faellt DIESER Schritt auf — genau so gewollt, denn ein
      # stiller Skip waere wieder ein Gate, das nichts pruefet.
      - name: Run full Playwright suite (root config — web + regression)
        run: npm run test:e2e -- --reporter=list
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      # ── Wave-21-C2: perf-baseline gated on percentile thresholds ──
      # P95<500 / P99<1000 for risks-list, P95<200 for health.
      # Runs against the same web server the Playwright smoke just used.
      # Script's `thresholds` block exits non-zero on regression.
      - name: Install k6
        # Direct binary install — apt+gpg flow doesn't work in this
        # runner sandbox (dirmngr not available). The release tarball
        # is ~25 MB, single-binary, no deps. Pin version for repro.
        #
        # [WP10 · S13-27] Vorher wurde das Archiv direkt in `sudo tar -xz`
        # gepipet — ohne jede Integritaetspruefung, mit Root-Rechten, nach
        # /usr/local/bin. Ein kompromittiertes Release-Artefakt haette
        # Codeausfuehrung als root im Runner ergeben. Jetzt: erst
        # herunterladen, dann gegen die SHA-256 aus der offiziellen
        # Checksums-Datei pruefen, erst danach entpacken.
        run: |
          set -euo pipefail
          K6_VERSION=v0.55.2
          K6_SHA256=d9a91fcee7eb70193324a53c9cc142a359c63b63eeb6b8a050f13d9fa442c5ee
          TARBALL="k6-${K6_VERSION}-linux-amd64.tar.gz"
          curl -sSLf -o "/tmp/${TARBALL}" \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/${TARBALL}"
          echo "${K6_SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin --strip-components=1 \
            -f "/tmp/${TARBALL}" "k6-${K6_VERSION}-linux-amd64/k6"
          sudo chmod +x /usr/local/bin/k6
          k6 version

      # [WP10 · S13-27] Die Zugangsdaten unten sind die des DEMO-SEEDS in
      # der Wegwerf-Datenbank dieses Jobs (`grc_platform_test`, existiert
      # nur fuer die Dauer des Runs). Das ist fuer sich folgenlos.
      #
      # Der eigentliche Befund war die NORMALISIERUNG desselben Paares an
      # drei Stellen: `deploy/README.md:24` gab es als PRODUKTIONS-Login aus
      # und `scripts/pilot-readiness-gate.sh:32` als Staging-Default. Beide
      # sind in dieser Remediation entfernt (S13-09e bzw. S13-30); der Wert
      # existiert nur noch hier und im Demo-Seed, der sich in
      # NODE_ENV=production selbst verweigert (#SEC-F04).
      - name: Run k6 perf baseline (Wave-21-C2)
        env:
          ARCTOS_BASE: http://localhost:3000
          # Demo-Seed-Identitaet der CI-Wegwerf-DB — NICHT in einer
          # Umgebung verwenden, die den Lauf ueberlebt.
          ARCTOS_EMAIL: admin@arctos.dev
          ARCTOS_PASSWORD: admin123
        run: k6 run --summary-export=/tmp/k6-summary.json scripts/perf/ci-baseline.js

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: k6-perf-baseline
          path: /tmp/k6-summary.json
          retention-days: 30

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-server-log
          path: /tmp/web-server.log
          retention-days: 7

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Stop web server
        if: always()
        run: |
          if [ -f /tmp/web-server.pid ]; then
            kill "$(cat /tmp/web-server.pid)" 2>/dev/null || true
          fi

  # ────────────────────────────────────────────────
  # 4. Database migration & integrity verification
  # ────────────────────────────────────────────────
  database:
    name: DB Migration & Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: grc
          POSTGRES_PASSWORD: grc_test_password
          POSTGRES_DB: grc_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grc -d grc_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --shm-size 256mb

    env:
      DATABASE_URL: postgresql://grc:grc_test_password@localhost:5432/grc_platform

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # [WP10 · S08-09/S08-19] Lifecycle-Skripte des gesamten Baums nicht
      # ausfuehren; die zwei Pakete des Produktionsbaums, die tatsaechlich
      # Code ausfuehren, gezielt nachziehen. Identisch zum Dockerfile.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild @parcel/watcher @swc/core --foreground-scripts 2>/dev/null || true

      - name: Create PostgreSQL extensions
        run: |
          PGPASSWORD=grc_test_password psql -h localhost -U grc -d grc_platform -c "
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
            CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
            -- [ARCTOS-FULL-2026-08-31 / WP1] pgvector wird von 0050, 0356,
            -- 0368 und 0377 gebraucht. Solange CI das Schema ueber
            -- create-missing-tables.ts zusammenstueckelte, fiel das nicht auf.
            CREATE EXTENSION IF NOT EXISTS vector;
          "

      # [ARCTOS-FULL-2026-08-31 / WP1 · S09-02, S09-03, S13-01]
      # Vorher baute CI das Schema auf einem eigenen, dritten Weg:
      # `drizzle-kit migrate` (nur 25 Journal-Dateien) + eine Shell-Schleife
      # mit `|| true` (verschluckt jeden Fehler) + `create-missing-tables.ts`
      # (legt fehlende Tabellen ohne FK, Index, Constraint, Enum und RLS an).
      # Ergebnis: CI validierte ein Schema, das in keiner Umgebung existierte,
      # und BASE-002 war hier per Bauart unsichtbar. CI benutzt jetzt denselben
      # Runner wie Dev, DR und Audit; der Entrypoint fuehrt dieselbe Sequenz
      # aus. Ein Fehlschlag bricht den Job ab.
      - name: Build schema from migrations
        working-directory: packages/db
        run: DATABASE_URL="postgresql://grc:grc_test_password@localhost:5432/grc_platform" npx tsx src/migrate-all.ts

      - name: Run catalog and framework seeds
        run: |
          for f in packages/db/sql/seed_*.sql; do
            echo "Seeding: $(basename $f)"
            PGPASSWORD=grc_test_password psql -h localhost -U grc -d grc_platform -f "$f" 2>&1 | tail -1
          done

      # ────────────────────────────────────────────────────────────────
      # [ARCTOS-FULL-2026-08-31 / WP10 · S13-02]
      #
      # Hier standen vier Assertions mit Schwellen bei ~2 % des
      # Erwartungswerts: >=10 Tabellen (594 real), >=6 RLS-Policies
      # (2.624 real), >=4 Audit-Trigger (283 real), >=5 Append-only-Rules
      # (9 real). Ein Commit, der 500 Tabellen bricht oder RLS von 400
      # Tabellen entfernt, passierte sie gruen — sie detektierten
      # ausschliesslich den Totalausfall der Datenbank.
      #
      # scripts/verify-db-integrity.mjs misst dieselben Groessen gegen
      # scripts/db-integrity-baseline.json. Die Werte dort stammen aus einem
      # echten Migrationslauf von Null (402/402, 603 Objekte), nicht aus
      # einer Schaetzung, und duerfen um hoechstens 2 % unterschritten
      # werden. Zusaetzlich geprueft: FORCE-RLS je Tabelle (S01-20) und die
      # Zahl der SECURITY-DEFINER-Funktionen, die auch nach OBEN auffaellt
      # (S01-13 — jede neue umgeht RLS).
      # ────────────────────────────────────────────────────────────────
      - name: Verify DB integrity against measured baseline
        run: node scripts/verify-db-integrity.mjs
        env:
          DATABASE_URL: postgresql://grc:grc_test_password@localhost:5432/grc_platform

      - name: Run seed
        working-directory: packages/db
        run: npx tsx src/seed.ts

      - name: Verify hash chain integrity
        run: |
          RESULT=$(PGPASSWORD=grc_test_password psql -h localhost -U grc -d grc_platform -t -c "
            WITH RECURSIVE chain AS (
              SELECT id, entry_hash, 1 AS seq
              FROM audit_log WHERE previous_hash IS NULL
              UNION ALL
              SELECT a.id, a.entry_hash, c.seq + 1
              FROM audit_log a JOIN chain c ON a.previous_hash = c.entry_hash
            )
            SELECT CASE
              WHEN (SELECT count(*) FROM chain) = (SELECT count(*) FROM audit_log)
              THEN 'PASS' ELSE 'FAIL'
            END;
          " | tr -d ' ')
          echo "Hash chain integrity: $RESULT"
          if [ "$RESULT" != "PASS" ]; then
            echo "::error::Audit log hash chain integrity check FAILED"
            exit 1
          fi

      - name: Test RLS isolation
        run: |
          PGPASSWORD=grc_test_password psql -h localhost -U grc -d grc_platform -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'grc_app') THEN
                CREATE ROLE grc_app LOGIN PASSWORD 'grc_app_pass';
              END IF;
            END \$\$;
            GRANT USAGE ON SCHEMA public TO grc_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO grc_app;
          "
          ROWS=$(PGPASSWORD=grc_app_pass psql -h localhost -U grc_app -d grc_platform \
            -t -c "SELECT count(*) FROM organization;" | tr -d ' ')
          echo "Rows visible without context (grc_app, non-superuser): $ROWS"
          if [ "$ROWS" != "0" ]; then
            echo "::error::RLS FAILURE — expected 0 rows without org context, got $ROWS"
            exit 1
          fi

          # ── #SEC-F05 canary: prove the SUPERUSER path bypasses RLS ──
          # This is the whole point of running the app as grc_app: under
          # the superuser `grc` (BYPASSRLS) the very same query WITHOUT any
          # org context returns ALL rows. Asserting it here documents the
          # danger and guarantees the regression test itself is meaningful
          # (if this ever returned 0, RLS-enforcement semantics changed and
          # the grc_app assertion above would be a false comfort).
          SU_ROWS=$(PGPASSWORD=grc_test_password psql -h localhost -U grc -d grc_platform \
            -t -c "SELECT count(*) FROM organization;" | tr -d ' ')
          echo "Rows visible without context (grc, SUPERUSER — RLS bypassed): $SU_ROWS"
          if [ "${SU_ROWS:-0}" -lt 1 ]; then
            echo "::error::Expected the superuser to bypass RLS and see >=1 org (seed created one). Got $SU_ROWS — RLS canary is broken."
            exit 1
          fi
          echo "F-05 canary OK: superuser bypasses RLS (>=1 row), grc_app is blocked (0 rows). App MUST run as grc_app in prod."

  # ────────────────────────────────────────────────
  # 5. Production build + Docker image
  # ────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests, integration-tests, e2e-smoke, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────────────────────────────
      # [ARCTOS-FULL-2026-08-31 / WP10 · S08-07]
      #
      # Reihenfolge umgedreht. Vorher: beide Images wurden mit
      # `push: true` nach `ghcr.io/...:latest` UND `:<sha>` gepusht und
      # ERST DANACH von Trivy gescannt. Enthielt ein Image eine
      # CRITICAL-Luecke, brach der Job zwar ab — aber `:latest` zeigte zu
      # dem Zeitpunkt bereits auf das verwundbare Image, und
      # deploy/update-all.sh zieht `:latest`. Ein rotes CI verhinderte das
      # Deployment nicht; es meldete es nachtraeglich.
      #
      # Jetzt: `load: true` baut lokal in den Docker-Daemon des Runners,
      # Trivy scannt das LOKALE Image, und der Push laeuft erst danach —
      # er wird gar nicht erreicht, wenn der Scan failt.
      #
      # `sbom: true` / `provenance: mode=max` (#S08-12): jedes gepushte
      # Image traegt seine Stueckliste und seine Herkunft als Attestation
      # mit. Ohne sie war nach einem neuen Advisory nicht feststellbar,
      # welches bereits ausgelieferte Image betroffen ist.
      # ────────────────────────────────────────────────────────────────
      - name: Build Web Image (local, not pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            arctos-local/grc-web:${{ github.sha }}
          # #WAVE23.1: bake the commit SHA + branch + build time into
          # the image so /api/v1/_meta/build can serve them. Used by
          # the D1 deploy-verification step in pilot-readiness-gate.
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build Worker Image (local, not pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.worker
          load: true
          push: false
          tags: |
            arctos-local/grc-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Smoke test worker image
        # Catches the "@anthropic-ai/sdk not found" class of regressions
        # that previously crash-looped on the server for 4 days.
        #
        # We run the REAL entrypoint (tsx + apps/worker/src/index.ts) so
        # Node's module resolver walks up from the importing source file
        # — that's how npm workspaces resolve non-hoisted deps like
        # @anthropic-ai/sdk (in packages/ai/node_modules/). A plain
        # `node -e 'require(...)'` from /app can't see those.
        #
        # The worker will fail to connect to DB (placeholder port) and
        # exit; the point is that every module must FIRST load cleanly.
        # A MODULE_NOT_FOUND anywhere means the image is broken.
        run: |
          docker run -d --name worker-smoke \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://placeholder:placeholder@127.0.0.1:65535/placeholder \
            -e AUTH_SECRET=smoke-secret-do-not-use \
            -e ARCTOS_SKIP_CONFIG_ASSERT=true \
            arctos-local/grc-worker:${{ github.sha }}
          sleep 10
          LOG=$(docker logs worker-smoke 2>&1 || true)
          docker rm -f worker-smoke >/dev/null 2>&1 || true
          echo "----- worker-smoke log -----"
          echo "$LOG"
          echo "----- end log -----"
          if echo "$LOG" | grep -qE "MODULE_NOT_FOUND|Cannot find module"; then
            echo "::error::Worker image is missing a node module — see log above"
            exit 1
          fi
          echo "worker image boots cleanly (no MODULE_NOT_FOUND)"

      # Trivy scans the final images. We skip `/usr/local/lib/node_modules/npm`
      # because that's the base image's bundled npm — our app never invokes
      # npm at runtime in the container (entrypoint runs node directly). The
      # npm-shipped deps there (picomatch 4.0.3 in node:22-alpine) bleed
      # into the scan without being an actual attack surface for the app.
      - name: Trivy image scan — web (BEFORE push, #S08-07)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: arctos-local/grc-web:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          skip-dirs: /usr/local/lib/node_modules/npm

      - name: Trivy image scan — worker (BEFORE push, #S08-07)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: arctos-local/grc-worker:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          skip-dirs: /usr/local/lib/node_modules/npm

      # ────────────────────────────────────────────────────────────────
      # [WP10 · S08-07 / S08-12] Erst jetzt pushen — der Job kommt hier nur
      # an, wenn Worker-Smoke UND beide Trivy-Scans gruen waren. Der
      # zweite Build-Aufruf ist billig: der Layer-Cache aus dem
      # `load: true`-Lauf ist warm, es wird nur noch hochgeladen.
      #
      # `sbom: true` und `provenance: mode=max` haengen jedem Image seine
      # Stueckliste und seine Build-Herkunft als Attestation an.
      # ────────────────────────────────────────────────────────────────
      - name: Push Web Image (scan passed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository }}/grc-web:latest
            ghcr.io/${{ github.repository }}/grc-web:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Push Worker Image (scan passed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository }}/grc-worker:latest
            ghcr.io/${{ github.repository }}/grc-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      # [WP10 · S08-12] Die repo-eigene CycloneDX-SBOM als langlebiges
      # Artefakt. Die Attestation am Image ist an die Registry gebunden;
      # dieses Artefakt ueberlebt eine Image-Loeschung und ist die
      # Grundlage der Betroffenheitsanalyse nach einem neuen Advisory.
      - name: Upload CycloneDX SBOM for this release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ github.sha }}
          path: SBOM/
          retention-days: 365

  # ────────────────────────────────────────────────
  # 6. Pilot-Readiness-Gate (Wave-23)
  #
  # Runs scripts/pilot-readiness-gate.sh against the staging URL.
  # Verifies the W23 acceptance items live: A1 finding FK persistence,
  # A2 /admin/branding never-500, C3 contracts name-alias never-500,
  # plus hash-chain integrity. Required for merge to main.
  #
  # [ARCTOS-FULL-2026-08-31 / WP10 · S13-30] Der Skip ist nicht mehr
  # bedingungslos. Ohne STAGING_URL failt das Gate — ausser bei einem
  # Fork-PR, wo GitHub Secrets bauartbedingt nicht bereitstellt; das meldet
  # das Skript als NOT_APPLICABLE, nicht als bestanden. Zusaetzlich failt
  # es, wenn auf Staging ein anderer Commit laeuft als der gepruefte.
  # ────────────────────────────────────────────────
  pilot-readiness-gate:
    name: Pilot Readiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests, integration-tests]
    # Only on PRs targeting main — push to main means the merge already
    # happened, gate is informational at that point.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run pilot-readiness-gate against staging
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          # #S13-30: das Skript unterscheidet Fork-PR (Secrets bauartbedingt
          # nicht verfuegbar) von "Secret fehlt" nur, wenn es das
          # Head-Repository kennt.
          GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          # #S13-30: gegen welchen Commit die Aussage gilt.
          EXPECTED_STAGING_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/pilot-readiness-gate.sh

  # ────────────────────────────────────────────────
  # 7. Security audit
  # ────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # [WP10 · S08-09/S08-19] Lifecycle-Skripte des gesamten Baums nicht
      # ausfuehren; die zwei Pakete des Produktionsbaums, die tatsaechlich
      # Code ausfuehren, gezielt nachziehen. Identisch zum Dockerfile.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild @parcel/watcher @swc/core --foreground-scripts 2>/dev/null || true

      - name: npm audit (production deps)
        # Gate mit dokumentierter, befristeter Allowlist — failt bei jedem
        # neuen high/critical-Advisory, siehe scripts/audit-gate.mjs.
        run: node scripts/audit-gate.mjs

      - name: RLS request-context ratchet
        # #SEC-F01b-RUN / PR #414: failt, sobald eine NEUE Route authentifizierte
        # bare `db.*`-Reads ohne withErrorHandler-/Read-Context-Frame macht (liefe
        # kontextlos → RLS-gefiltert leer / 500). Baseline darf nur schrumpfen,
        # siehe scripts/route-rls-context-baseline.txt.
        run: node scripts/check-route-rls-context.mjs

      # [WP10 · S08-15] `--only-verified` meldet ausschliesslich
      # Credentials, die trufflehog per Live-Aufruf gegen den Anbieter
      # bestaetigen kann. Strukturell unsichtbar bleiben damit
      # DB-Connection-Strings, Redis-/AMQP-Passwoerter, private Schluessel
      # und alle Secrets selbst gehosteter Dienste (Garage, MinIO, ClamAV,
      # FreeTSA) — also genau die Klasse, die diese Architektur ueberwiegend
      # nutzt. Fuer die PR-Rueckmeldung bleibt die rauscharme Variante; der
      # vollstaendige Historien-Scan ohne `--only-verified` laeuft
      # woechentlich in secret-scanning.yml und wird als Artefakt gesichert.
      - name: Check for leaked secrets (verified only — PR feedback)
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --only-verified --results=verified

      - name: Check for .env files in repo
        run: |
          # Exclude anything whose final segment is a recognized template
          # marker: .env.example, .env.sample, .env.template, or .env.<any>.example
          # (e.g. deploy/.env.production.example). Those are expected to live
          # in the repo. Real .env files would match the pattern but not the
          # template-suffix filter.
          ENV_FILES=$(git ls-files '*.env' '*.env.*' '.env*' 2>/dev/null \
            | grep -vE '(^|/)(\.gitignore|\.env\.example|\.env\.sample|\.env\.template|\.env\.[^/]+\.example)$' \
            || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::Environment files found in repo: $ENV_FILES"
            exit 1
          fi

      # ────────────────────────────────────────────────────────────────
      # [ARCTOS-FULL-2026-08-31 / WP10 · S08-10 / S08-02]
      #
      # Ersetzt:
      #   npx license-checker --production \
      #     --failOn "GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0" --excludePrivatePackages
      #
      # Vier belegte Defekte des alten Aufrufs:
      #   1. `--failOn` verglich Zeichenketten — `GPL-3.0-only` und
      #      `GPL-3.0-or-later` wurden nie getroffen.
      #   2. SSPL, CC-BY-SA, EUPL, BUSL, OSL, CDDL, Elastic-2.0 fehlten in
      #      der Sperrliste.
      #   3. Custom-Lizenzen waren unsichtbar: `bpmn-js` deklariert
      #      "SEE LICENSE IN LICENSE" und passierte das Gate gruen, waehrend
      #      der Wasserzeichen-Verstoss aus S08-02 im Repo aktiv war. Das
      #      Gate haette den einzigen echten Lizenzverstoss des Produkts nie
      #      gefunden.
      #   4. `npx license-checker` zog unversionierten Fremdcode zur
      #      Laufzeit aus der Registry — in einem Sicherheitspruefschritt.
      #      Das Paket ist zudem seit Jahren unwartet.
      #
      # Das neue Gate laeuft offline aus dem installierten Baum, wertet
      # SPDX-Ausdruecke bestandteilweise aus, erzwingt fuer UNKNOWN- und
      # Custom-Lizenzen eine namentliche Freigabe und prueft die
      # bpmn.io-Wasserzeichen-Bedingung technisch nach.
      # ────────────────────────────────────────────────────────────────
      - name: License compliance gate
        run: node scripts/license-gate.mjs

      # [WP10 · S08-16] NOTICE und THIRD-PARTY-LICENSES.md muessen zum
      # installierten Baum passen. 441 Pakete des Produktionsbaums tragen
      # Namensnennungspflichten, die bei Weitergabe als Docker-Image gelten;
      # bis 2026-08-31 lag dem Image nichts davon bei.
      - name: NOTICE / THIRD-PARTY-LICENSES up to date
        run: node scripts/generate-notice.mjs --check

      # [WP10 · S08-12] CycloneDX-SBOM (voller Baum + Produktionsbaum). Ohne
      # sie ist nach einem neuen Advisory nicht feststellbar, welche bereits
      # ausgelieferten Images betroffen sind.
      - name: SBOM up to date
        run: node scripts/generate-sbom.mjs --check

      # [WP10 · S08-06/S08-19] Beim Abschluss dieses Pakets lieferte
      # react-grid-layout@1.5.3 — eine Produktionsabhaengigkeit von apps/web —
      # ein ausfuehrbares Mach-O-arm64-Binary (`ip_fetcher`), dessen
      # curl-Quelle und ein 374 KB grosses yarn-error.log des Maintainers mit.
      # Wirkungslos in unserem Baum (kein bin, kein Install-Hook, falsche
      # Architektur), aber von KEINER bestehenden Kontrolle bemerkt: npm audit
      # kennt nur CVEs, Dependabot nur Versionen, die Lizenzpruefung nur SPDX.
      # Behoben durch 1.5.4 (dort sind die Dateien entfernt); diese Pruefung
      # sorgt dafuer, dass der naechste Fall auffaellt.
      - name: Dependency hygiene (Binaries, Install-Hooks, Arbeitsdateien)
        run: node scripts/check-dependency-hygiene.mjs

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: SBOM/
          retention-days: 365

      # ── #SEC-F05 / OP-090 / OP-091: Rollentrennung im Deployment ──
      # Hier stand ein Inline-Block, der mit
      #   "F-05 OK: web=grc_app (RLS enforced), worker=grc (privileged…)"
      # schloss. Diese Zusage war zum Zeitpunkt der Pruefung bereits ueberholt
      # (der Worker faehrt seit WP9/S01-09 als `grc_worker`), und der Block
      # haette den Rueckfall auf den SUPERUSER nicht bemerkt: gemessen laeuft
      # er gruen gegen eine Fassung, in der die Worker-Zeile wieder auf
      # `postgresql://grc:` steht. Ersetzt durch ein Skript, das man lokal
      # ausfuehren und damit gegenpruefen kann.
      - name: Deployment-Rollentrennung (web=grc_app, worker=grc_worker, :?-Pflicht)
        run: node scripts/check-compose-db-roles.mjs
